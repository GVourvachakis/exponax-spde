  <!-- ═══════════════════════════════════════════════════════════════════════════
     STOCHASTIC ENSEMBLE VISUALIZATION
     ───────────────────────────────────────────────────────────────────────────
     All 8 sample paths share the same initial condition at (350, 148) — the
     shared u0 from stochastic_ensemble_rollout(stepper, T=500, M=64)(u0, key).
     Spread grows proportionally to √t (Wiener diffusion variance), with cubic
     Bézier control-point perturbations giving each path Brownian roughness.
     Colors encode height: blue above mean (upper paths), red below (lower
     paths), matching the original logo's own color geography.
     ═══════════════════════════════════════════════════════════════════════════ -->

  <!-- UNCERTAINTY ENVELOPE — filled region bounded by the two extreme paths.
     Forward along P0 (upper), backward along P7 (lower). The fill grows
     from transparent at the origin to slightly visible at the right edge,
     encoding growing variance Var[u(x,T)] ∝ T. -->
  <path d="
  M 350,148
  C 383,145 407,137 440,136
  C 473,137 497,118 530,118
  C 563,107 587,117 620,104
  C 653,107 677,87  710,88
  C 743,74  767,86  800,69
  C 827,72  853,49  880,51
  L 880,248
  C 853,233 827,245 800,231
  C 767,233 743,212 710,214
  C 677,200 653,208 620,197
  C 587,199 563,178 530,179
  C 497,167 473,175 440,163
  C 407,156 383,157 350,148 Z" fill="url(#env_g)"/>

  <!-- DASHED CENTRELINE — E[u], the deterministic mean trajectory.
     Dashes evoke time-stepping; the horizontal line is exact for the
     Allen-Cahn zero-mean invariant measure. -->
  <line x1="350" y1="148" x2="881" y2="148" stroke="#9867a8" stroke-width="0.85" stroke-dasharray="5,9" stroke-linecap="round" opacity="0.32"/>

  <!-- ── P0  far above mean — deep blue (#024aa5) ─────────────────────────
     Spread factor at x=880: −97px. Strong Brownian oscillations. -->
  <path d="M 350,148
  C 383,145 407,137 440,136
  C 473,137 497,118 530,118
  C 563,107 587,117 620,104
  C 653,107 677,87  710,88
  C 743,74  767,86  800,69
  C 827,72  853,49  880,51" fill="none" stroke="#024aa5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.58"/>

  <!-- ── P1  upper — medium blue (#0268c0) ─────────────────────────────── -->
  <path d="M 350,148
  C 383,143 407,145 440,139
  C 473,140 497,124 530,126
  C 563,117 587,124 620,116
  C 653,118 677,102 710,102
  C 743,90  767,100 800,88
  C 827,89  853,73  880,76" fill="none" stroke="#0268c0" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.62"/>

  <!-- ── P2  upper-mid — blue-purple (#4f86d0) ─────────────────────────── -->
  <path d="M 350,148
  C 383,146 407,146 440,143
  C 473,145 497,134 530,135
  C 563,129 587,135 620,128
  C 653,130 677,118 710,118
  C 743,110 767,118 800,110
  C 827,114 853,102 880,105" fill="none" stroke="#4f86d0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" opacity="0.67"/>

  <!-- ── P3  near-upper — purple (#7876bb) ─────────────────────────────── -->
  <path d="M 350,148
  C 383,148 407,146 440,146
  C 473,147 497,141 530,143
  C 563,139 587,143 620,139
  C 653,142 677,136 710,138
  C 743,134 767,139 800,134
  C 827,136 853,129 880,131" fill="none" stroke="#7876bb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>

  <!-- ── P4  near-lower — purple-pink (#9867a8) ────────────────────────── -->
  <path d="M 350,148
  C 383,148 407,151 440,151
  C 473,150 497,155 530,155
  C 563,153 587,161 620,160
  C 653,163 677,159 710,162
  C 743,166 767,161 800,166
  C 827,169 853,165 880,169" fill="none" stroke="#9867a8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>

  <!-- ── P5  lower-mid — deep pink (#cc3a6d) ───────────────────────────── -->
  <path d="M 350,148
  C 383,152 407,151 440,155
  C 473,161 497,157 530,163
  C 563,161 587,173 620,172
  C 653,180 677,173 710,180
