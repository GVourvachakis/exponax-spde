  <!-- ── P6  lower — salmon (#f06678) ─────────────────────────────────── -->
  <path d="M 350,148
  C 383,155 407,154 440,159
  C 473,168 497,162 530,171
  C 563,170 587,185 620,183
  C 653,193 677,186 710,196
  C 743,194 767,212 800,210
  C 827,221 853,211 880,222" fill="none" stroke="#f06678" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" opacity="0.62"/>

  <!-- ── P7  far below mean — deep red (#ff424b) ───────────────────────── -->
  <path d="M 350,148
  C 383,157 407,156 440,163
  C 473,175 497,167 530,179
  C 563,178 587,199 620,197
  C 653,208 677,200 710,214
  C 743,212 767,233 800,231
  C 827,245 853,233 880,248" fill="none" stroke="#ff424b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.58"/>

  <!-- MARGINAL DENSITY PROFILE — the sideways Gaussian silhouette at the
     right canvas edge visualises the ensemble's marginal distribution p(u,T)
     at the final time step, i.e. what structure_factor() converges to.
     The shape is a cubic-Bézier Gaussian approximation:
       x_left(y) = 881 − 21·exp(−(y−148)²/5000)
     widest at the mean (y=148), tapering to a sliver at the extremes. -->
  <path d="M 878,51
  C 869,51 860,100 860,148
  C 860,196 869,241 878,248
  L 881,248 L 881,51 Z" fill="url(#den_g)"/>

  <!-- ORIGIN MARKER — the shared initial condition u0.
     All sample paths are seeded here, mirroring the (u0, key) calling
     convention: stochastic_ensemble_rollout(stepper, T, M)(u0, key).
     The outer glow circle encodes the initial probability mass (Dirac δ). -->
  <circle cx="350" cy="148" r="10" fill="#af6aa3" opacity="0.34"/>
  <circle cx="350" cy="148" r="3.5" fill="#af6aa3" opacity="0.82"/>

</svg>
