name: Upstream exponax advisory

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install ".[test]"
      - run: python -m pip install --no-deps --force-reinstall "exponax @ git+https://github.com/Ceyron/exponax"
      - name: Print upstream version and commit
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import distribution

          upstream = distribution("exponax")
          vcs = json.loads(upstream.read_text("direct_url.json"))["vcs_info"]
          print(f"exponax {upstream.version} at {vcs['commit_id']}")
          PY
      - run: python -m pytest -m "not slow" -q
