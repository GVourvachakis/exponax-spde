name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Check committed notebook outputs
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          listed = subprocess.check_output(["git", "ls-files", "-z", "--", "*.ipynb"])
          paths = [os.fsdecode(path) for path in listed.split(b"\0") if path]
          dirty = []
          for path in paths:
              blob = subprocess.check_output(["git", "show", f":{path}"])
              for number, cell in enumerate(json.loads(blob)["cells"], 1):
                  if cell["cell_type"] == "code" and (
                      cell.get("outputs") or cell.get("execution_count") is not None
                  ):
                      dirty.append(f"{path}: cell {number}")
          if dirty:
              print("\n".join(dirty))
              raise SystemExit(1)
          print(f"{len(paths)} tracked notebooks have no outputs or execution counts.")
          PY
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        exponax-version: ["0.2.0", "0.2.1"]
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]" "exponax==${{ matrix.exponax-version }}"
      - run: python -m pip freeze | grep -iE "^(jax|jaxlib|equinox|jaxtyping|exponax)=="
      - run: python -m pytest -m "not slow" -q
  test-python-floor:
    # Python floor check is informational.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: python -m pip install -e ".[test]"
      - run: python -m pip freeze | grep -iE "^(jax|jaxlib|equinox|jaxtyping|exponax)=="
      - run: python -m pytest -m "not slow" -q
  test-float32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]" "exponax==0.2.1"
      - run: env -u JAX_ENABLE_X64 python -m pytest -q tests/test_float32_smoke.py
